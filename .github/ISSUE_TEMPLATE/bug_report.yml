name: 🐛 Bug Report
description: Report a bug or unexpected behavior in UPI Soundbox
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Go to '...'
        3. Do '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: device-manufacturer
    attributes:
      label: Device Manufacturer
      placeholder: e.g., Samsung, Xiaomi, OnePlus
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device Model
      placeholder: e.g., Galaxy S24, Redmi Note 13
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: e.g., Android 14 (API 34)
    validations:
      required: true

  - type: dropdown
    id: upi-app
    attributes:
      label: UPI App
      description: Which UPI app were you using when the bug occurred?
      options:
        - Google Pay
        - PhonePe
        - Paytm
        - BHIM
        - Amazon Pay
        - CRED
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: UPI Soundbox Version
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: If applicable, paste relevant log output or attach screenshots.
      render: shell
    validations:
      required: false
