name: Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name, for example 0.3.0"
        required: true
        default: "0.2.0"
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$(grep -oE ': [0-9]+' app/build.gradle.kts | tail -1 | tr -d ': ')"
          elif [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == release/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#release/}"
            VERSION_NAME="${VERSION_NAME#v}"
            VERSION_CODE="$(grep -oE ': [0-9]+' app/build.gradle.kts | tail -1 | tr -d ': ')"
          else
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          fi
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          CI_BUILD_NUMBER="$VERSION_CODE" CI_GIT_TAG="$VERSION_NAME" \
            ./gradlew assembleDebug --no-daemon --console=plain

      - name: Create versioned APK asset
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release/UPI-Soundbox-v${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Publish GitHub Release
        shell: bash
        run: |
          TAG="v${VERSION_NAME}"
          gh release create "$TAG" \
            "release/UPI-Soundbox-v${VERSION_NAME}-${VERSION_CODE}.apk" \
            --title "UPI Soundbox ${VERSION_NAME}" \
            --notes "Consecutive payment capture, resilient audio checks, and the frost-glass dashboard redesign."

