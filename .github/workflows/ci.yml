name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run detekt
        run: ./gradlew detekt
      - name: Run ktlint
        run: ./gradlew ktlintCheck
      - name: Run lint
        run: ./gradlew lint
      - name: Run tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug
        run: ./gradlew assembleDebug
      - name: Check no INTERNET permission
        run: |
          ./gradlew :app:processDebugManifest
          MERGED=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' "$MERGED"; then
            echo "ERROR: INTERNET permission found in merged manifest!"
            exit 1
          fi
          echo "OK: No INTERNET permission in merged manifest."
